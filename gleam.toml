name = "zfs"
version = "1.0.0"

description = "Low level ZFS ioctl wrappers for Gleam"
licences = ["BSD-2-Clause"]
repository = { type = "github", user = "ryan-moeller", repo = "gleam-zfs" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
nvpair = {
  git = "https://github.com/ryan-moeller/gleam-nvpair",
  ref = "265fa0b7009de487e916109862c013486fe3dfeb"
}
gleam_erlang = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
file_streams = {
  git = "https://github.com/ryan-moeller/file_streams",
  ref = "be77ab1a50a631ec68fe01fd11b92431ca3bc4e2"
}
pprint = ">= 1.0.6 and < 2.0.0"
iv = ">= 1.4.4 and < 2.0.0"
