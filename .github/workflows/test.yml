name: "FreeBSD 15.1"

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: test on FreeBSD 15.1
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cache-after-prepare: true
          prepare: |
            pkg install -y \
              FreeBSD-src-sys \
              erlang \
              erlang-runtime29 \
              gleam \
              mold \
              git
          run: |
            set -e
            make CPPFLAGS=-DZFS_DEBUG
            # gleam test exits 0 if the VM is killed by a signal, so wrap erl
            # to report that as an ordinary nonzero exit status.
            wrapper=$(mktemp -d)
            printf '#!/bin/sh\n%s "$@"\nexit $?\n' "$(command -v erl)" > "$wrapper/erl"
            chmod +x "$wrapper/erl"
            PATH="$wrapper:$PATH" gleam test
            gleam format --check src test
